# Nginx no host do VPS, na frente do container nextjs (127.0.0.1:3000).
# Instalar:  sudo cp deploy/nginx/intellisuite.conf /etc/nginx/sites-available/intellisuite
#            sudo sed -i 's/SEU_DOMINIO/exemplo.com.br/' /etc/nginx/sites-available/intellisuite
#            sudo ln -s /etc/nginx/sites-available/intellisuite /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
#            sudo certbot --nginx -d exemplo.com.br        # acrescenta o bloco HTTPS e o redirect

upstream intellisuite_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name SEU_DOMINIO;
    server_tokens off;

    # Upload de PDFs grandes (o app limita a 50 MB; aqui sobra margem para multipart).
    client_max_body_size 100M;

    location / {
        proxy_pass http://intellisuite_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OBRIGATÓRIO para streaming (SSE) de LLM: sem isto a resposta só aparece inteira no fim.
        proxy_buffering off;
        proxy_cache off;

        # O Nginx não comprime aqui: um `gzip_types` global que inclua text/plain (comum em
        # nginx.conf "otimizado") faz o Nginx segurar a resposta para comprimir e quebra o streaming
        # sem nenhum erro. O Next já comprime o que pode e sabe dar flush em respostas em stream.
        gzip off;

        # OCR do docling e sínteses longas.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
