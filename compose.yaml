# Base = produção. Em dev o compose.override.yaml é carregado
# automaticamente: desliga nextjs/migrate e publica as portas em 127.0.0.1.
# Em produção use sempre: docker compose -f compose.yaml ...
services:
  nextjs:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://intellisuite:${POSTGRES_PASSWORD}@postgres:5432/intellisuite
      DOCLING_URL: http://docling:5001
      SEARXNG_URL: http://searxng:8080
      HF_HOME: /app/.cache
    volumes:
      - hf_cache:/app/.cache
    healthcheck:
      # a imagem não tem curl/wget; o próprio Node faz a chamada. /api/health só devolve 503 se o
      # banco cair (docling/SearXNG fora = "degraded", ainda 200), então o container não é marcado
      # como doente por causa de um serviço opcional.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      migrate: { condition: service_completed_successfully }
      docling: { condition: service_healthy }
      searxng: { condition: service_healthy }
    restart: unless-stopped

  migrate:
    build: { context: ., target: migrator }
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://intellisuite:${POSTGRES_PASSWORD}@postgres:5432/intellisuite
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: intellisuite
      POSTGRES_USER: intellisuite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intellisuite -d intellisuite"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.38.1
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
    healthcheck:
      # imagem Python: não depende de curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2026.10.25-54ca1d9cf
    volumes:
      - ./searxng:/etc/searxng:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?defina SEARXNG_SECRET no arquivo .env}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  hf_cache:
